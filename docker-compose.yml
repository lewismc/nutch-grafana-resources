# Docker Compose for Apache Nutch Grafana Monitoring Stack
# Supports both local and Grafana Cloud deployment modes
#
# Usage:
#   Local mode:  docker compose --profile local up -d
#   Cloud mode:  docker compose up -d
#
# See .env.example for configuration options

services:
  # ============================================================================
  # GRAFANA - Visualization and Dashboards
  # ============================================================================
  grafana:
    image: grafana/grafana:12.3.0
    container_name: nutch-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000}
      # Enable provisioning
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - nutch-monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # GRAFANA ALLOY - Telemetry Collection Agent
  # ============================================================================
  alloy:
    image: grafana/alloy:v1.12.2
    container_name: nutch-alloy
    restart: unless-stopped
    ports:
      - "${ALLOY_HTTP_PORT:-12345}:12345"  # Alloy UI
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      # Deployment mode: 'local' or 'cloud'
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-local}
      # Grafana Cloud credentials (for cloud mode)
      - LOKI_URL=${LOKI_URL:-http://loki:3100}
      - LOKI_USERNAME=${LOKI_USERNAME:-}
      - PROMETHEUS_URL=${PROMETHEUS_URL:-http://prometheus:9090}
      - PROMETHEUS_USERNAME=${PROMETHEUS_USERNAME:-}
      - GRAFANA_CLOUD_API_KEY=${GRAFANA_CLOUD_API_KEY:-}
    volumes:
      - ./alloy/config.docker.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      # Mount Nutch logs directory (configurable via NUTCH_LOGS_PATH)
      - ${NUTCH_LOGS_PATH:-./sample-logs}:/var/log/nutch:ro
    networks:
      - nutch-monitoring
    depends_on:
      grafana:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:12345/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # LOKI - Log Aggregation (Local Mode Only)
  # ============================================================================
  loki:
    image: grafana/loki:3.6.3
    container_name: nutch-loki
    restart: unless-stopped
    profiles:
      - local
    ports:
      - "${LOKI_PORT:-3100}:3100"
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./docker/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    networks:
      - nutch-monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # PROMETHEUS - Metrics Storage (Local Mode Only)
  # ============================================================================
  prometheus:
    image: prom/prometheus:v3.9.1
    container_name: nutch-prometheus
    restart: unless-stopped
    profiles:
      - local
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - nutch-monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  nutch-monitoring:
    driver: bridge

# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  grafana-data:
  alloy-data:
  loki-data:
  prometheus-data:
